# Canvas-migration eval set v1 (FreelyGive engagement, July 2026).
# One agentic migration run produces a workspace; the questions grade that
# workspace stage by stage. metadata.run_group tells the runner which
# questions share one run (the agentic half is expensive: ~1h, ~$50).
# Path metadata keys are the scaffold seam: the values below are the July
# SUT (DDEV-Canvas + canvas-migration addon, storybook workspace nested
# under storybook/). Re-target another scaffold by overriding metadata,
# never by editing commands. See README.md.
questions:
- id: cm01_skill_gate
  input: |
    Pre-flight: verify the system under test is ready before the agentic run
    starts - the kit's flagship skill is discoverable in the migration
    workspace and the bed carries the reset harness's state record.
  criteria: >
    The kit's flagship skill file (metadata.skill_dir, injected per bed by
    the reset harness) exists as SKILL.md (uppercase) - a lowercase skill.md
    is invisible to Claude Code on case-sensitive filesystems and the
    migration silently runs without the skill's process and QA gates. And
    .abp-eval/state.json exists non-empty, proving the bed was reset to
    baseline by the reset harness rather than graded dirty.
  bundle: canvas_migration
  rubric_ref: rubric/cm01_skill_gate@1.1
  metadata:
    run_group: fg-homepage-e2e
    stage: gate
    phase: pre_run
    checks_dir: evals/canvas-migration/checks
    skill_dir: .claude/skills/website-to-components
    seeded_by: "WS0 finding 6 / DDEV-migration-addon PR #13 (2026-07-15)"
    note: >
      phase: pre_run - the executor runs this BEFORE the agentic run
      (adversarial review: checked after the run, the agent could create the
      file itself; checked before, it is a genuine environment gate). The
      exact-name ls match defeats case-insensitive filesystems where test -f
      SKILL.md would also match skill.md.
- id: cm02_mechanical_complete
  input: |
    Run the mechanical half of the pipeline against the frozen source capture
    (homepage scope) and confirm its outputs are complete.
  criteria: >
    The pipeline output directory contains a non-empty full-page screenshot,
    a non-empty dom-sections.json, and at least one downloaded resource for
    the scoped page.
  bundle: canvas_migration
  rubric_ref: rubric/cm02_mechanical_complete@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: capture
    checks_dir: evals/canvas-migration/checks
    output_dir: website-to-components/output/freelygive.io
- id: cm03_story_syntax
  input: |
    Validate the syntax of every generated page story in the workspace.
  criteria: >
    validate-page-stories.js exits 0 (no fatal problems that would prevent
    Storybook from starting). WARN lines are acceptable.
  bundle: canvas_migration
  rubric_ref: rubric/cm03_story_syntax@1.1
  metadata:
    run_group: fg-homepage-e2e
    stage: story
    pipeline_dir: website-to-components
    workspace: storybook
- id: cm04_typecheck_delta
  input: |
    Typecheck the workspace and compare failing files against the pristine-kit
    baseline.
  criteria: >
    No file outside the recorded baseline fails tsc. The pristine starter kit
    itself fails its own typecheck (5 known locations), so a raw exit-code
    gate can never pass; only agent-introduced errors count.
  bundle: canvas_migration
  rubric_ref: rubric/cm04_typecheck_delta@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: build
    checks_dir: evals/canvas-migration/checks
    workspace: storybook
    baseline: evals/canvas-migration/harness/tsc-baseline.txt
    seeded_by: "run-0 calibration finding 1"
- id: cm05_canvas_validate
  input: |
    Validate every generated component spec against the Canvas component
    schema.
  criteria: >
    `npm run canvas:validate` exits 0 with every component valid.
  bundle: canvas_migration
  rubric_ref: rubric/cm05_canvas_validate@1.1
  metadata:
    run_group: fg-homepage-e2e
    stage: validate
    workspace: storybook
- id: cm06_story_build
  input: |
    Build the static Storybook site from the migrated workspace.
  criteria: >
    `npm run build` exits 0. Note the container policy: the build only works
    in the storybook service container, not the web container (EACCES on the
    node_modules volume) - the harness routes it, the case only asserts the
    result.
  bundle: canvas_migration
  rubric_ref: rubric/cm06_story_build@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: build
    workspace: storybook
    container: storybook
- id: cm07_canvas_push
  input: |
    Push the migrated components to the local Drupal Canvas.
  criteria: >
    `npm run canvas:push:local` exits 0 AND reports at least
    min_components pushed ("Push completed: N components"). A push that
    exits 0 with a trivial count is a failure - the homepage migration
    produced 29 on run-0, so 10 is a lenient floor. Note: stdout comes from
    agent-writable npm scripts, so cm08's server-side delta is the
    authoritative oracle; this check is the fast client-side signal.
  bundle: canvas_migration
  rubric_ref: rubric/cm07_canvas_push@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: upload
    checks_dir: evals/canvas-migration/checks
    workspace: storybook
    min_components: "10"
- id: cm08_push_landed
  input: |
    Verify server-side that the pushed components actually landed in Drupal.
  criteria: >
    The number of js_component entities in Drupal (via drush entityQuery)
    EXCEEDS the post-reset baseline count. Client-side exit 0 is not proof
    of landing, and an absolute threshold would pass on entities left by
    prior runs (adversarial review). baseline_count is recorded by the
    reset harness (0 on a pristine reset) and injected by the executor.
  bundle: canvas_migration
  rubric_ref: rubric/cm08_push_landed@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: upload
    checks_dir: evals/canvas-migration/checks
    drupal_root: web
    baseline_count: "0"
- id: cm09_parity_filtered
  input: |
    Compare the element inventory of the archived source capture against the
    built page, with the known-noise allowlist applied.
  criteria: >
    Zero unexplained missing elements. element-inventory.js always exits 0 in
    diff mode - the result is only in stdout, so the wrapper parses it,
    strips allowlisted noise (cookie banner, GTM iframe, cart link, the
    %28-encoding image renames, animation/carousel classes), and fails on
    anything left. Parity MUST run against the archived file:// snapshot,
    never the live site.
  bundle: canvas_migration
  rubric_ref: rubric/cm09_parity_filtered@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: parity
    checks_dir: evals/canvas-migration/checks
    pipeline_dir: website-to-components
    source_url: "file:///var/www/html/website-to-components/output/freelygive.io/source-snapshot/index.html"
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    allowlist: evals/canvas-migration/harness/noise-allowlist.txt
    snapshot_note: >
      The file:// snapshot is CREATED BY THE RESET HARNESS at WS2 (archived
      mirror of the mechanical capture); it does not exist yet. The wrapper
      hard-fails on non-file:// sources (ABP_PARITY_ALLOW_LIVE=1 escape for
      ungraded calibration only) - run-0 shipped the live URL here and both
      adversarial reviewers caught the contradiction.
    advisory_pixel: "per-section pixelmatch ratios are run artifacts, never a gate (confirmed brittle)"
    seeded_by: "run-0 calibration findings 2, 3, 5"
- id: cm10_hero_variants
  input: |
    Check that all rotating hero headline variants from the source made it
    into the migrated story source.
  criteria: >
    Every headline variant of the rotating hero exists somewhere in the
    workspace src/ (story data or component). The source renders variants as
    alternating DOM nodes; a build that keeps only the first variant has
    dropped content. Greps the story SOURCE, not the rendered DOM, so
    animation timing cannot mask the check.
  bundle: canvas_migration
  rubric_ref: rubric/cm10_hero_variants@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: parity
    checks_dir: evals/canvas-migration/checks
    workspace: storybook
    content_scope: storybook/src/stories
    expected_strings: "Full Stack CRM with AI solutions|Improving your CRM with|Artificial Intelligence"
    note: >
      Run-0 verdict: PASSES against the story source (verified 2026-07-15 on
      the archived run-1 workspace) - all variants are in the data; the
      rendered-DOM parity misses were animation timing, not dropped content.
      This is exactly why the check greps source: a DOM-based version would
      have filed a false positive.
    seeded_by: "run-0 calibration finding 4 (repeating-blocks class)"
- id: cm11_testimonials_present
  input: |
    Check that every testimonial quote and attribution from the source made it
    into the migrated story source.
  criteria: >
    Both quotes and both attributions exist in the workspace src/. Greps the
    story SOURCE because testimonial carousels render one slide at a time -
    the rendered DOM legitimately shows only the active slide (known noise),
    but the story data must carry all of them.
  bundle: canvas_migration
  rubric_ref: rubric/cm11_testimonials_present@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: parity
    checks_dir: evals/canvas-migration/checks
    workspace: storybook
    content_scope: storybook/src/stories
    expected_strings: "capturing and scoring what something means|James Abrahams|excellent partner|Lesley Stewart"
    seeded_by: "run-0 calibration finding 4 + fg-content-mapping class"
- id: cm13_press_caption_present
  input: |
    Check that the press/video block's title text from the source made it
    into the migrated story source.
  criteria: >
    The "AI module to power websites for Starshot" title exists in the
    workspace src/. The source renders it as a heading, the build as a video
    caption - a legitimate render shift, which is why the rendered-DOM
    parity check allowlists it and THIS check enforces the content. The
    grep string deliberately avoids the apostrophe: source DOM uses a
    typographic quote, the story source a straight one.
  bundle: canvas_migration
  rubric_ref: rubric/cm13_press_caption_present@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: parity
    checks_dir: evals/canvas-migration/checks
    workspace: storybook
    content_scope: storybook/src/stories
    expected_strings: "AI module to power websites for Starshot"
    seeded_by: "run-0 parity decomposition (render-shift class, 2026-07-15)"
- id: cm12_screenshot_gate
  input: |
    Capture full-page screenshots of the built page (desktop and mobile
    viewports) as scoreboard artifacts.
  criteria: >
    agent-browser produces a valid, non-trivial PNG for both viewports after
    a scroll-through (lazy-loaded images must trigger before capture). A
    failed capture is a blocking infra failure, not a skipped advisory -
    without the artifact the run is not reviewable.
  bundle: canvas_migration
  rubric_ref: rubric/cm12_screenshot_gate@1.1
  metadata:
    run_group: fg-homepage-e2e
    stage: gate
    checks_dir: evals/canvas-migration/checks
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    artifact_dir: screenshots
    seeded_by: "run-0 capture-protocol false positive (lazy-loaded cards)"
- id: cm14_container_width
  input: |
    Verify the built page constrains its content column to the source site's
    max-width at the pinned desktop viewport.
  criteria: >
    The content column at the "Our CRM Solutions" landmark measures the
    source's 1280px (+/- tolerance) at 1440x900. Run-1 build measured 550px
    (heading floats in a full-bleed 1425px section) - the expert-review miss
    this case reproduces. Computed geometry, not pixels: the fact comes from
    getBoundingClientRect on the landmark's ancestor chain.
  bundle: canvas_migration
  rubric_ref: rubric/cm14_container_width@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: container_max_width
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review 2026-07-15, finding 1"
- id: cm15_video_stagger
  input: |
    Verify the video blocks reproduce the source's uneven (staggered)
    placement instead of an evenly-aligned row.
  criteria: >
    The top-y spread of the three video blocks is at least 40px (source
    staggers them 647/724/801, spread 154px). Video blocks include
    thumbnail-link embeds, not just iframes - the run-1 build renders
    YouTube thumbs in one even row (spread 0), the expert-review miss this
    case reproduces.
  bundle: canvas_migration
  rubric_ref: rubric/cm15_video_stagger@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: video_stagger
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review 2026-07-15, finding 2"
- id: cm16_crm_two_col
  input: |
    Verify the product images below "Our CRM Solutions" render in the
    source's two-column layout.
  criteria: >
    The first image row below the landmark heading has exactly 2 columns
    (source: phone mock at x=180, laptop mock at x=664, one row). The run-1
    build stacks them in a single centered column - the expert-review miss
    this case reproduces.
  bundle: canvas_migration
  rubric_ref: rubric/cm16_crm_two_col@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: crm_two_col
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review 2026-07-15, finding 3"
- id: cm17_underline_accent
  input: |
    Verify the caption underline ACCENT from the source is reproduced, not
    replaced by a default link underline.
  criteria: >
    Each caption landmark present on the page carries a decorative underline
    mechanism from the spec's accept_mechanisms (adjacent shape / border /
    background). The source paints brush-stroke SVGs; the run-1 build has
    only plain text-decoration, which the expert verdict counts as a miss -
    so text-decoration is deliberately NOT accepted.
  bundle: canvas_migration
  rubric_ref: rubric/cm17_underline_accent@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: underline_accent
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review 2026-07-15, finding 4"
- id: cm18_section_dividers
  input: |
    Verify the built page has the source's full-width shaped section
    dividers (curved/angled band boundaries).
  criteria: >
    At least 2 full-width shaped divider regions exist (clip-path or SVG
    shapes clustered by position; source has exactly 2). Guards the
    dropped-dividers regression class. NOTE: the run-1 build PASSES this
    count fact (2 angled polygon dividers) while the expert review of the
    run-0 screenshots called dividers missing - either run-0 lacked them or
    the finding is about position/shape, not presence; flagged for expert
    re-review before tightening the spec.
  bundle: canvas_migration
  rubric_ref: rubric/cm18_section_dividers@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: section_dividers
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review 2026-07-15, finding 5"
- id: cm19_no_horizontal_overflow
  input: |
    Verify the built page does not scroll horizontally at the pinned mobile
    viewport.
  criteria: >
    document scrollWidth <= viewport width (+2px slack) at 390x844. Run-0's
    video block (w-full inside mx-6) overflows to 399px and paints a white
    stripe down the entire site. Universal invariant - fails loudly on
    short/unrendered pages via min_page_height.
  bundle: canvas_migration
  rubric_ref: rubric/cm19_no_horizontal_overflow@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: mobile_no_overflow
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), video overflow / white stripe"
- id: cm20_header_row_layout
  input: |
    Verify the mobile header is a two-column row: logo left, menu control
    right.
  criteria: >
    Logo and menu control share a row (center-y within 25px), control right
    of logo, logo left-aligned (center < 35% viewport). Run-0 centers the
    logo and pushes the burger below it.
  bundle: canvas_migration
  rubric_ref: rubric/cm20_header_row_layout@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: mobile_header_row
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), header layout"
- id: cm21_hero_text_style
  input: |
    Verify the hero heading's typography matches the source: font weight and
    line-height ratio.
  criteria: >
    Weight 400 and line-height ratio 1.0 (+/-0.15) as on source; run-0
    renders weight 700 at ratio ~1.2. Font family and size are advisory
    facts, deliberately not gated (a deliberate font substitution should not
    fail the eval; weight/leading drift should). Seed case for the broader
    "typography has quite a few misses" class - more text_style instances
    can be added per landmark.
  bundle: canvas_migration
  rubric_ref: rubric/cm21_hero_text_style@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: mobile_hero_text_style
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), hero typography"
- id: cm22_accent_text_color
  input: |
    Verify the footer "Happy to help" text keeps the source's brand-yellow
    color.
  criteria: >
    Computed color equals the source's rgb(242, 203, 7); run-0 renders it
    white. Exact computed-color compare on a text landmark.
  bundle: canvas_migration
  rubric_ref: rubric/cm22_accent_text_color@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: footer_accent_color
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), footer color"
- id: cm23_cards_row_pattern
  input: |
    Verify the AI/Talks/Work cards keep the source's mobile row pattern.
  criteria: >
    The three card labels cluster into rows [2,1] (AI+Talks share a row,
    Work centered below) at 390x844, as on source; run-0 stacks them
    [1,1,1].
  bundle: canvas_migration
  rubric_ref: rubric/cm23_cards_row_pattern@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: mobile_cards_row_pattern
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), cards 1-col collapse"
- id: cm24_clients_grid_pattern
  input: |
    Verify the client logos keep the source's mobile grid pattern and size.
  criteria: >
    Logo grid below "Our Clients" clusters into rows [2,2,1] with images
    >= 100px wide, as on source (116-243px); run-0 stacks them
    single-column at 96px - both the pattern and the size regressed.
  bundle: canvas_migration
  rubric_ref: rubric/cm24_clients_grid_pattern@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: mobile_clients_grid
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), clients grid + logo size"
- id: cm25_footer_copyright_last
  input: |
    Verify the copyright line is the footer's last block, as on source.
  criteria: >
    The copyright sits below every contact and social link and within 300px
    of the page end; run-0 parks it mid-footer right under the logo, above
    contact and social.
  bundle: canvas_migration
  rubric_ref: rubric/cm25_footer_copyright_last@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: footer_copyright_last
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), footer order"
- id: cm26_social_icons_position
  input: |
    Verify the social icons sit beside the contact details, as on source.
  criteria: >
    Social links render to the right of the contact block (min x past the
    contact right edge) within the same y-band; run-0 stacks them below at
    the left margin.
  bundle: canvas_migration
  rubric_ref: rubric/cm26_social_icons_position@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    spec: evals/canvas-migration/harness/layout-spec.json
    assertion: footer_social_beside_contact
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    seeded_by: "expert screenshot review pass 2 (2026-07-17), social icons placement"
- id: cm27_collection_props_slots
  input: |
    Verify repeating collections are built to Andrew's carousel pattern:
    items exposed as props/slots so end users can edit them in Canvas.
  criteria: >
    The component owning the client-logo collection (landmarks: "Enders
    Analysis", "National Criminal Justice") either declares a slot or
    array-typed prop (open collection, the pristine brand_carousel shape),
    or is an item component repeated in editable page composition. Run-3
    built fre_client_logo_grid with TEN enumerated scalar props
    (logo1Src..logo5Alt) - a fixed shape nobody can extend without code,
    exactly the AI-OOB failure Jamie named (07-17). Doubles as the
    skills-on vs skills-off comparison case for Phase 2.
  bundle: canvas_migration
  rubric_ref: rubric/cm27_collection_props_slots@1.2
  metadata:
    run_group: fg-homepage-e2e
    stage: pattern
    checks_dir: evals/canvas-migration/checks
    workspace: storybook
    collection_landmarks: "Enders Analysis,National Criminal Justice"
    seeded_by: "Jamie's carousel spec (Slack 2026-07-17) + run-3 fre_client_logo_grid"
- id: cm28_canvas_page_served
  input: |
    Verify the CMS actually serves the migrated homepage as a page - the
    destination render, not the Storybook preview.
  criteria: >
    Some single page the Drupal site serves over HTTP (front page, any
    canvas_page or node alias) contains ALL the source homepage landmarks
    (hero heading + "Our CRM Solutions"; multi-landmark after the
    adversarial review - one planted phrase cannot pass), matched on
    tag-stripped text or, for client-side-hydrated Canvas pages, on the
    hydration props in the raw body (visible rendering of the same
    landmarks is cm30/cm31's geometry probes, which anchor on this text
    in a real browser). Run-3 pushed 34 components with exit 0 yet the front page
    still serves the starter kit's "Your hero content goes here" - the
    migration never reached the destination as a page. The pipeline has a
    pages path (canvas:pages:build + canvas:pages:local) that the migration
