- id: cm40_geometry_fidelity
  input: |
    Verify the built page reproduces the source's measured geometry -
    section heights, widths and order, anchor typography (font-size,
    weight, color) and top-to-bottom content order - against a spec
    auto-extracted from the source at grade time.
  criteria: >
    geometry-probe.sh exits 0 under the two-tier rule (rubric 1.2): every
    STRUCTURAL gate in the source-extracted spec (section heights, widths,
    order, anchor content-flow order) holds on the built page at the pinned
    viewport, and STYLE gates (anchor font-size/weight/color) hold at >= 90%
    - thresholded because an auto-extracted spec carries tolerance quirks a
    hand-calibrated one does not, so one stray font-weight must not sink 60
    holding assertions; style misses above the threshold remain visible
    findings in the run artifacts. Unlike cm14-cm18
    (hand-calibrated single facts), the spec here is generated per run by
    text-twin pairing: expected values are measured on the SOURCE render,
    selectors resolved on the BUILT DOM, so the check survives DOM churn
    between kits and needs no recalibration. Coverage minimums (paired
    sections/anchors) plus a 60% pairing-ratio gate over the source's
    gradeable anchors close the vacuous-pass hole - a build sharing too
    little text with the source FAILS as a migration finding. The
    extraction map's skip list doubles as a missing-content report (it
    surfaced the 6 missing nav links, cm32's family, on the 2026-08-11
    calibration run). Probe INFRA exits 2 and is reported as harness
    breakage, never a design verdict.
  bundle: canvas_migration
  rubric_ref: rubric/cm40_geometry_fidelity@1.2
  metadata:
    run_group: fg-homepage-e2e
    stage: geometry
    checks_dir: evals/canvas-migration/checks
    geom_source_url: "https://freelygive.io/"
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    component: pages-home
    geom_viewport: 1280x900
    seeded_by: "geom-probe calibration vs migrated story 2026-08-11; extends the cm14-cm18 parity family"
    note: >
      Extraction currently measures the LIVE source (same caveat the
      1.0-live-calibration layout-spec carried); switching geom_source_url
      to the frozen file:// snapshot needs a host-visible path - the
      state.json source_url is container-absolute, hence the distinct key
