- id: cm45_content_centered
  input: |
    Verify the built page's width-capped content columns are horizontally
    centered at a wide viewport, where max-width caps actually bind.
  criteria: >
    center-parity.sh exits 0 on the built story at 1920x1080: every
    rendered element whose computed max-width is an absolute px cap that
    binds, and which spans at least half the layout viewport, has left and
    right gaps symmetric within 24px (one spacing unit; the systematic
    headless-scrollbar skew measures 16px on truly centered columns, and
    the source's own content column measures dead-center 320/320).
    Deliberately generic - the probe derives columns from computed style,
    no selectors or component names, so kit restyles and target changes
    need no recalibration. Seeded by the m-auto/mx-6 class-order bomb: both
    classes set the same margins, CSS emission order decides the winner,
    and margin-inline silently kills margin:auto - hero, videos, tiles and
    clients columns snap left in any context without a centering ancestor,
    at every viewport wider than the cap. All pinned viewports before this
    case were <= 1440, where a 1360px cap barely binds, so no existing
    check could see it. Gates the rendered fact, so it fails whichever way
    the defect arrives (class order, missing --spacing, dropped wrapper).
    A page with no capped columns is INFRA, never a verdict.
  bundle: canvas_migration
  rubric_ref: rubric/cm45_content_centered@1.0
  metadata:
    run_group: fg-homepage-e2e
    stage: layout
    checks_dir: evals/canvas-migration/checks
    built_url: "https://storybook.fg-canvas-eval.ddev.site/iframe.html?id=pages-freelygive-home--default&viewMode=story"
    component: pages-home
