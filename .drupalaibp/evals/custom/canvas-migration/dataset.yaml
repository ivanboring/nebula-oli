- id: cm43_image_parity_served
  input: |
    Verify the SERVED Drupal page renders the source's images - the same
    presence and rendered-size parity as cm42, measured on the page the
    client actually sees, where Drupal image styles apply.
  criteria: >
    image-parity.sh exits 0 against the served page: every visible source
    image has a twin rendered within 20% (min 8px) on both axes. The
    served plane is where migration-baked image-style derivatives bite -
    cm42's storybook measurement found the build's image FILES are
    thumbnails (client logos natural 31x20 stretched to 200x133, the FG
    monogram 40x13 drawn at 191x64), damage invisible to any DOM check
    and fully outside the storybook CSS story. Three guards keep the
    verdict honest: the site consumer's token is attached for SSO-walled
    served origins (source arm) via a mode-0600 header file scoped to
    that origin only; a sentinel ("Skip to main content", which Drupal
    core ships on every rendered page) distinguishes the graded page from
    an HTTP-200 auth wall - sentinel absent is INFRA, never "all images
    missing" (measured on the Okta wall 2026-08-12: 0 paired / 30
    missing / 1 extra, a lie); and <img> keys pair on the original
    filename embedded in Drupal's /styles/<style>/public/ derivative
    paths (trailing .webp/.avif stripped), so an honestly styled
    foo.png.webp still twins with the source's foo.png. INFRA exit 2 is
    harness breakage, never a design verdict.
  bundle: canvas_migration
  rubric_ref: rubric/cm43_image_parity_served@1.0
