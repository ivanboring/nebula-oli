# Canvas Workbench + browser tooling for this project. Merged into the DDEV
# project config generated by the One Line Installer (which owns config.yaml —
# project type and docroot).
#
# This file carries ALL recurring, per-start setup so the project stands up
# with plain `ddev start` / `ddev restart` alone — no installer re-run.
# One-time scaffold steps (Nebula fetch, git re-init, first npm install,
# Canvas wiring, baseline staging) live in the .drupalaibp/ install hooks
# instead.

# Nebula's .nvmrc pins Node 22.
nodejs_version: "22"

web_environment:
  # Playwright downloads its browsers here; the path is a DDEV global-cache
  # mount, so chromium survives image rebuilds and is shared across projects.
  - PLAYWRIGHT_BROWSERS_PATH=/mnt/ddev-global-cache/playwright-browsers
  # Canvas Workbench is a Vite dev server, and Vite blocks requests whose Host
  # header it does not know. This is Vite's escape hatch: allow the DDEV
  # router's *.ddev.site hostnames.
  - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.ddev.site

# Expose Canvas Workbench (container port 5173, Vite's default) on the router.
web_extra_exposed_ports:
  - name: workbench
    container_port: 5173
    http_port: 5172
    https_port: 5173

# Run Canvas Workbench as a managed daemon. It crash-loops until node_modules
# exists; the post-start hook below installs deps and restarts it
# deterministically.
web_extra_daemons:
  - name: workbench
    command: "npm run dev -- --host=0.0.0.0 --port=5173"
    directory: /var/www/html

hooks:
  post-start:
    # 1. Node deps + browsers, then bring the Workbench daemon up. Guarded on
    #    package.json so the very first start (before fetch-nebula.sh lands
    #    the template at ddev_started) is a clean no-op.
    - exec: |
        if [ -f package.json ]; then
          if [ ! -d node_modules ]; then
            echo "Installing npm dependencies..."
            npm ci || npm install
          fi
          echo "Ensuring Playwright chromium is installed..."
          npx --yes playwright install chromium || true
          supervisorctl restart webextradaemons:workbench || true
        fi
    # 2. Trust the DDEV/mkcert CA inside the container so headless Chrome
    #    (Playwright and agent-based browsing) can load https://*.ddev.site.
    - exec: |
        mkdir -p "$HOME/.pki/nssdb"
        [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d sql:"$HOME/.pki/nssdb" -N --empty-password || true
        if command -v mkcert >/dev/null 2>&1; then
          certutil -d sql:"$HOME/.pki/nssdb" -A -t "C,," -n mkcert-ca -i "$(mkcert -CAROOT)/rootCA.pem" 2>/dev/null || true
        fi
